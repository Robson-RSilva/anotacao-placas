<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="description" content="Anotação de dados de treino do detector de marcações: tudo roda no navegador e os arquivos ficam na pasta de cada pessoa.">
  <title>Anotação de dados para treino</title>
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
  <script type="module" src="js/ui/app.js"></script>
</head>
<body class="pagina-central">
  <div id="app"><p class="carregando">Carregando…</p></div>

  <noscript><p class="erro">Esta página precisa de JavaScript.</p></noscript>

  <!-- ================================================================== boas-vindas -->
  <template id="tpl-inicio">
    <header class="barra">
      <h1>Anotação de dados para treino</h1>
      <span class="sutil" data-versao></span>
    </header>
    <main class="central estreito">
      <section class="cartao destaque">
        <h2>Onde ficam os arquivos</h2>
        <p>Tudo roda neste navegador, nesta máquina. Os quadros, rótulos e revisões ficam numa pasta de trabalho no seu computador — de preferência a pasta da equipe no Google Drive, sincronizada pelo Google Drive para computador. Esta página não envia nada para a internet.</p>
        <div id="continuar" class="bloco" hidden>
          <p>Da última vez você usou <b id="nome-anterior"></b>.</p>
          <button type="button" class="primario" id="btn-continuar">Continuar nessa pasta</button>
        </div>
        <div class="botoes">
          <button type="button" class="primario" id="btn-escolher">Escolher a pasta de trabalho</button>
          <button type="button" id="btn-navegador">Guardar neste navegador</button>
        </div>
        <p class="sutil" id="aviso-pasta" hidden>Este navegador não deixa escolher uma pasta. Use o Chrome ou o Edge no computador, ou guarde neste navegador e leve os arquivos em .zip.</p>
        <p class="erro" id="erro-inicio" role="alert"></p>
      </section>
      <details class="cartao ajuda">
        <summary>Qual escolher?</summary>
        <ul>
          <li><b>Pasta de trabalho</b> (Chrome ou Edge): escolha a pasta da equipe no Drive. Cada pessoa grava só os próprios arquivos, então a sincronização nunca entra em conflito.</li>
          <li><b>Neste navegador</b>: sem pasta sincronizada. Traga os arquivos num .zip pela página central e, ao terminar, baixe os seus num .zip para quem coordena.</li>
        </ul>
      </details>
    </main>
  </template>

  <!-- ================================================================== central -->
  <template id="tpl-central">
    <header class="barra">
      <h1>Anotação de dados para treino</h1>
      <span class="sutil" data-versao></span>
      <span class="espaco"></span>
      <form class="quem" id="form-pessoa">
        <label for="pessoa">Seu código</label>
        <input id="pessoa" list="pessoas" autocomplete="off" spellcheck="false" maxlength="10" placeholder="ex.: RS" aria-describedby="dica-pessoa">
        <datalist id="pessoas"></datalist>
        <span class="sutil" id="dica-pessoa" role="status"></span>
      </form>
    </header>

    <main class="central">
      <section id="aviso-vazia" class="cartao destaque" hidden>
        <h2>Esta pasta ainda não é uma pasta de trabalho</h2>
        <p class="sutil" id="nome-vazia"></p>
        <div class="botoes">
          <button type="button" class="primario" id="criar-vazia">Criar pasta de trabalho</button>
          <button type="button" id="criar-exemplo">Criar com o exemplo (estádio sintético)</button>
          <button type="button" id="trocar-vazia">Escolher outra pasta</button>
          <label class="botao">Trazer a cópia de um .zip<input type="file" id="trazer-zip-vazia" accept=".zip,application/zip" hidden></label>
        </div>
        <p class="sutil" id="res-vazia" role="status"></p>
      </section>

      <div id="conteudo-central">
        <section id="aviso-codigo" class="cartao alerta" role="alert" hidden>
          <p id="texto-aviso-codigo"></p>
          <div class="botoes"><button type="button" id="sou-eu">Sou eu, em outro computador</button></div>
        </section>
        <section class="cartoes">
          <article class="cartao">
            <h2>Câmera do quadro</h2>
            <p id="st-camera" class="sutil">—</p>
            <a class="botao primario" href="#/camera" id="ir-camera">Anotar</a>
          </article>
          <article class="cartao">
            <h2>Revisão cruzada</h2>
            <p id="st-revisao" class="sutil">—</p>
            <a class="botao" href="#/revisao" id="ir-revisao">Revisar</a>
          </article>
          <article class="cartao">
            <h2>Oclusão nas placas</h2>
            <p id="st-oclusao" class="sutil">—</p>
            <p id="st-revisao-oclusao" class="sutil"></p>
            <div class="botoes">
              <a class="botao primario" href="#/oclusao" id="ir-oclusao">Pintar</a>
              <a class="botao" href="#/revisao-oclusao" id="ir-revisao-oclusao">Revisar</a>
            </div>
          </article>
        </section>

        <section>
          <div class="titulo-secao">
            <h2>Partidas</h2>
            <a class="botao" href="#/importar" id="ir-importar">Importar partida</a>
          </div>
          <div class="rolavel">
            <table class="tabela" id="partidas">
              <thead><tr><th>Partida</th><th>Emissora</th><th>Condições</th><th>Sorteados</th><th>Anotados</th><th>Aprovados</th><th>Revisão pendente</th><th title="Pinturas aprovadas, dos quadros com a câmera aprovada">Oclusão</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section>
          <div class="titulo-secao">
            <h2>Placar</h2>
            <div class="botoes alternar" role="group" aria-label="Tarefa do placar">
              <button type="button" data-placar="camera" aria-pressed="true">Câmera</button>
              <button type="button" data-placar="oclusao" aria-pressed="false">Oclusão</button>
            </div>
          </div>
          <p class="sutil">Ponto só conta depois de aprovado na revisão cruzada.</p>
          <div class="rolavel">
            <table class="tabela" id="placar">
              <thead><tr><th>Pessoa</th><th>Aprovados na semana</th><th>Aprovados</th><th>Taxa de aprovação</th><th>Tempo mediano</th><th id="th-concordancia">Concordância (cegos)</th><th>Gabarito</th><th>Dias seguidos</th><th>Marcos</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section class="cartao">
          <h2>Pasta de trabalho</h2>
          <p><span id="pasta-nome"></span> <span class="sutil" id="pasta-modo"></span></p>
          <div class="botoes">
            <button type="button" id="trocar-pasta">Trocar de pasta</button>
            <button type="button" id="baixar-meus">Baixar os meus arquivos (.zip)</button>
            <button type="button" id="baixar-tudo">Baixar cópia da pasta (.zip)</button>
            <label class="botao">Trazer arquivos de um .zip<input type="file" id="trazer-zip" accept=".zip,application/zip" hidden></label>
            <a class="botao" href="#/coordenacao">Coordenação (opcional)</a>
          </div>
          <p class="sutil" id="res-pasta" role="status"></p>
        </section>
      </div>
    </main>

    <footer class="rodape">
      <span>Os dados ficam no seu computador; esta página não envia nada para a internet.</span>
      <a id="manual" href="#" target="_blank" rel="noopener noreferrer" hidden>Manual de anotação</a>
    </footer>
  </template>

  <!-- ================================================================== câmera -->
  <template id="tpl-camera">
    <header class="barra">
      <a href="#/" class="voltar">← Central</a>
      <h1>Câmera do quadro</h1>
      <span id="dica" class="dica"></span>
      <span class="tempo" title="Tempo ativo neste quadro">⏱ <span id="tempo">0:00</span></span>
    </header>

    <main class="editor">
      <div class="tela" id="area"><canvas id="tela" aria-label="Quadro com o molde do campo"></canvas>
        <div id="vazio" class="vazio" hidden></div>
      </div>

      <aside class="painel" id="painel" hidden>
        <section id="treino" class="faixa treino" hidden>
          Treino com gabarito: ao salvar, aparece a diferença para a câmera verdadeira.
        </section>
        <section id="devolvido" class="faixa devolvido" hidden></section>

        <section>
          <h2>Começar de</h2>
          <div class="linha-campos">
            <select id="registro" aria-label="Câmera do registro do estádio"></select>
            <button id="recomecar" type="button" title="Volta para a câmera escolhida e destrava tudo">Recomeçar</button>
          </div>
          <div class="botoes">
            <button id="virar" type="button">Virar o lado <kbd>F</kbd></button>
            <button id="desfazer" type="button">Desfazer <kbd>Ctrl Z</kbd></button>
          </div>
        </section>

        <section>
          <h2>Medidas do campo</h2>
          <div class="medidas">
            <input id="comprimento" type="number" min="90" max="120" step="0.5" inputmode="decimal" aria-label="Comprimento do campo, em metros" title="Comprimento: de uma linha de fundo à outra">
            <span>×</span>
            <input id="largura" type="number" min="45" max="90" step="0.5" inputmode="decimal" aria-label="Largura do campo, em metros" title="Largura: de uma lateral à outra">
            <span>m</span>
          </div>
          <p class="sutil">Comprimento × largura. As áreas, o círculo e os gols têm a medida da regra; o tamanho do campo muda de um estádio para outro. Se o molde não fecha com as linhas, ajuste aqui (o que está travado continua).</p>
        </section>

        <section>
          <h2>Travados <span id="n-pinos" class="contagem"></span></h2>
          <ul id="pinos" class="pinos"><li class="sutil">Arraste ou clique num ponto do molde para travar.</li></ul>
        </section>

        <section>
          <h2>Pronto quando</h2>
          <ul class="checagem">
            <li id="ck-pontos">3 pontos espalhados, ou 2 pontos e 1 linha</li>
            <li id="ck-residuo">molde a até 2 px dos travados</li>
            <li id="ck-lado-item"><label><input type="checkbox" id="ck-lado"> conferi o lado numa placa estática</label></li>
          </ul>
        </section>

        <section>
          <h2>Situação</h2>
          <div class="situacoes" id="situacoes">
            <label><input type="radio" name="situacao" value="ok" checked> Câmera certa</label>
            <label><input type="radio" name="situacao" value="sem_marcacoes"> Sem marcações suficientes</label>
            <label><input type="radio" name="situacao" value="impossivel_transicao"> Impossível: transição ou grafismo</label>
            <label><input type="radio" name="situacao" value="impossivel_borrao"> Impossível: borrão</label>
            <label><input type="radio" name="situacao" value="duvida"> Dúvida (com comentário)</label>
          </div>
          <textarea id="comentario" rows="2" placeholder="Comentário (obrigatório em dúvida)"></textarea>
        </section>

        <button id="salvar" class="primario" type="button">Salvar <kbd>S</kbd></button>
        <p id="erro" class="erro" role="alert"></p>

        <details class="ajuda">
          <summary>Como usar</summary>
          <ul>
            <li><b>Arrastar um ponto</b>: o molde inteiro acompanha; ao soltar, ele fica travado.</li>
            <li><b>Clicar num ponto</b>: trava onde está.</li>
            <li><b>Arrastar uma linha</b> (lateral, fundo): leva a linha até a pintada.</li>
            <li><b>Medidas do campo</b>: quando o campo é maior ou menor que 105 × 68 m, mude o comprimento e a largura; o que está travado continua.</li>
            <li><b>Botão direito</b> num travado: destrava.</li>
            <li><b>Roda do mouse</b>: aproxima. Arrastar o vazio move a vista. <kbd>0</kbd> volta a vista.</li>
            <li><kbd>L</kbd> nomes · <kbd>P</kbd> placas · <kbd>F</kbd> virar o lado · <kbd>S</kbd> salvar</li>
          </ul>
        </details>
      </aside>
    </main>

    <div id="modal" class="modal" hidden>
      <div class="caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
        <h2 id="modal-titulo"></h2>
        <p id="modal-texto"></p>
        <button id="modal-ok" class="primario" type="button">Próximo</button>
      </div>
    </div>
  </template>

  <!-- ================================================================== revisão -->
  <template id="tpl-revisao">
    <header class="barra">
      <a href="#/" class="voltar">← Central</a>
      <h1>Revisão cruzada</h1>
      <span id="dica" class="dica"></span>
      <span class="contagem-barra" id="pendentes"></span>
      <span class="tempo" title="Tempo ativo nesta revisão">⏱ <span id="tempo">0:00</span></span>
    </header>

    <main class="editor">
      <div class="tela" id="area"><canvas id="tela" aria-label="Quadro com o molde do rótulo em revisão"></canvas>
        <div id="vazio" class="vazio" hidden></div>
      </div>

      <aside class="painel" id="painel" hidden>
        <section class="faixa">Você não vê quem anotou. Confira as linhas, os arcos, as medidas do campo e o lado.</section>

        <section>
          <h2>O rótulo</h2>
          <dl class="ficha">
            <dt>Situação</dt><dd id="r-situacao"></dd>
            <dt>Resíduo mediano</dt><dd id="r-residuo"></dd>
            <dt>Partiu de</dt><dd id="r-partiu"></dd>
            <dt>Medidas do campo</dt><dd id="r-campo"></dd>
            <dt>Comentário</dt><dd id="r-comentario"></dd>
          </dl>
          <ul id="pinos" class="pinos"></ul>
        </section>

        <section id="decidir">
          <h2>Decisão</h2>
          <div class="botoes">
            <button id="aprovar" class="primario" type="button">Aprovar <kbd>A</kbd></button>
            <button id="corrigir" type="button">Corrigir <kbd>C</kbd></button>
            <button id="devolver" type="button">Devolver <kbd>D</kbd></button>
          </div>
          <p class="sutil">Diferença dentro da tolerância não se corrige: aprove.</p>
        </section>

        <section id="secao-devolver" hidden>
          <h2>Devolver</h2>
          <select id="motivo" aria-label="Motivo da devolução">
            <option value="lado_trocado">Lado trocado</option>
            <option value="molde_fora_da_tolerancia">Molde fora da tolerância</option>
            <option value="ponto_em_marca_coberta">Ponto travado em marca coberta</option>
            <option value="deveria_ser_sem_marcacoes">Deveria ser "sem marcações suficientes"</option>
            <option value="outro">Outro (com comentário)</option>
          </select>
          <textarea id="comentario-dev" rows="2" placeholder="Comentário"></textarea>
          <div class="botoes">
            <button id="confirmar-devolver" type="button" class="primario">Confirmar devolução</button>
            <button type="button" data-voltar>Voltar</button>
          </div>
        </section>

        <section id="secao-corrigir" hidden>
          <h2>Corrigir</h2>
          <p class="sutil">Ajuste o molde como na página de câmera. A correção vira uma versão nova, com a sua autoria.</p>
          <div class="botoes">
            <button id="virar" type="button">Virar o lado <kbd>F</kbd></button>
            <button id="desfazer" type="button">Desfazer</button>
          </div>
          <div class="medidas">
            <input id="comprimento" type="number" min="90" max="120" step="0.5" inputmode="decimal" aria-label="Comprimento do campo, em metros" title="Comprimento: de uma linha de fundo à outra">
            <span>×</span>
            <input id="largura" type="number" min="45" max="90" step="0.5" inputmode="decimal" aria-label="Largura do campo, em metros" title="Largura: de uma lateral à outra">
            <span>m</span>
          </div>
          <select id="situacao-corr" aria-label="Situação da correção">
            <option value="ok">Câmera certa</option>
            <option value="sem_marcacoes">Sem marcações suficientes</option>
            <option value="impossivel_transicao">Impossível: transição ou grafismo</option>
            <option value="impossivel_borrao">Impossível: borrão</option>
          </select>
          <textarea id="comentario-corr" rows="2" placeholder="Comentário"></textarea>
          <div class="botoes">
            <button id="salvar-correcao" class="primario" type="button">Salvar correção</button>
            <button type="button" data-voltar>Voltar</button>
          </div>
        </section>
        <p id="erro" class="erro" role="alert"></p>
      </aside>
    </main>
  </template>

  <!-- ================================================================== oclusão -->
  <template id="tpl-oclusao">
    <header class="barra">
      <a href="#/" class="voltar">← Central</a>
      <h1>Oclusão nas placas</h1>
      <span id="dica" class="dica"></span>
      <span class="tempo" title="Tempo ativo neste quadro">⏱ <span id="tempo">0:00</span></span>
    </header>

    <main class="editor">
      <div class="tela" id="area"><canvas id="tela" aria-label="Quadro com as placas e a pintura"></canvas>
        <div id="vazio" class="vazio" hidden></div>
      </div>

      <aside class="painel" id="painel" hidden>
        <section id="treino" class="faixa treino" hidden>
          Treino com gabarito: ao salvar, aparece a diferença para a máscara verdadeira, e dá para ver a resposta.
        </section>
        <section id="devolvido" class="faixa devolvido" hidden></section>
        <section id="partiu" class="faixa" hidden></section>

        <section id="resultado" class="faixa resultado" hidden>
          <h2 id="resultado-titulo"></h2>
          <p id="resultado-texto"></p>
          <ul id="resultado-placas" class="pinos"></ul>
          <div class="botoes">
            <button id="ver-resposta" type="button">Ver a resposta <kbd>R</kbd></button>
            <button id="proximo" class="primario" type="button">Próximo <kbd>N</kbd></button>
          </div>
        </section>

        <div id="edicao" class="secoes">
        <section>
          <h2>Pintar</h2>
          <div class="botoes alternar" role="group" aria-label="Ferramenta">
            <button type="button" data-ferramenta="pincel" aria-pressed="true">Pincel <kbd>B</kbd></button>
            <button type="button" data-ferramenta="laco" aria-pressed="false">Laço <kbd>L</kbd></button>
          </div>
          <label class="tamanho">Pincel <input id="raio" type="range" min="1" max="40" value="6" aria-label="Tamanho do pincel, em pixels da imagem"> <span id="raio-valor">6 px</span> <kbd>[</kbd> <kbd>]</kbd></label>
          <div class="classes" role="radiogroup" aria-label="O que cobre a placa">
            <label><input type="radio" name="classe" value="2" checked><span class="amostra" data-classe="2"></span> Pessoa <kbd>1</kbd></label>
            <label><input type="radio" name="classe" value="3"><span class="amostra" data-classe="3"></span> Bola <kbd>2</kbd></label>
            <label><input type="radio" name="classe" value="4"><span class="amostra" data-classe="4"></span> Rede do gol <kbd>3</kbd></label>
            <label><input type="radio" name="classe" value="5"><span class="amostra" data-classe="5"></span> Grafismo da emissora <kbd>4</kbd></label>
            <label><input type="radio" name="classe" value="6"><span class="amostra" data-classe="6"></span> Objeto (trave, câmera, banco…) <kbd>5</kbd></label>
            <label><input type="radio" name="classe" value="7"><span class="amostra" data-classe="7"></span> Não é placa (vão na faixa) <kbd>6</kbd></label>
            <label><input type="radio" name="classe" value="1"><span class="amostra" data-classe="1"></span> Apagar (placa livre) <kbd>E</kbd></label>
          </div>
          <div class="botoes">
            <button id="desfazer" type="button">Desfazer <kbd>Ctrl Z</kbd></button>
            <button id="refazer" type="button">Refazer</button>
          </div>
          <div class="camadas">
            <label><input type="checkbox" id="ver-pintura" checked> pintura <kbd>H</kbd></label>
            <label><input type="checkbox" id="ver-contornos" checked> contornos <kbd>O</kbd></label>
            <label><input type="checkbox" id="ver-molde"> linhas do campo <kbd>M</kbd></label>
          </div>
        </section>

        <section>
          <h2>Placas no quadro <span id="n-placas" class="contagem"></span></h2>
          <ul id="lista-placas" class="pinos"></ul>
          <div class="botoes"><button id="enquadrar" type="button" title="Aproxima a vista das placas que se pintam">Ir às placas <kbd>Z</kbd></button></div>
        </section>

        <section>
          <h2>Pronto quando</h2>
          <ul class="checagem">
            <li id="ck-pintaveis">há placa para pintar (as pequenas demais ficam de fora)</li>
            <li><label><input type="checkbox" id="ck-conferi"> conferi cada placa: o contorno e o que a cobre</label></li>
          </ul>
        </section>

        <section>
          <h2>Situação</h2>
          <div class="situacoes">
            <label><input type="radio" name="situacao" value="ok" checked> Pintado</label>
            <label><input type="radio" name="situacao" value="sem_placas"> Nenhuma placa para pintar</label>
            <label><input type="radio" name="situacao" value="camera_errada"> Câmera errada (o contorno não fecha com as placas)</label>
            <label><input type="radio" name="situacao" value="duvida"> Dúvida (com comentário)</label>
          </div>
          <textarea id="comentario" rows="2" placeholder="Comentário (obrigatório em dúvida)"></textarea>
        </section>

        <button id="salvar" class="primario" type="button">Salvar <kbd>S</kbd></button>

        <details id="secao-faixas" class="secao-faixas" hidden>
          <summary><h2>Faixas de placas <span id="resumo-faixas" class="contagem"></span></h2></summary>
          <div class="faixas">
            <span></span><b>Laterais</b><b>Fundos</b>
            <span class="sutil">da linha (m)</span>
            <input id="lat-distancia" type="number" min="0.5" max="30" step="0.1" inputmode="decimal" aria-label="Distância das placas laterais até a lateral, em metros">
            <input id="fun-distancia" type="number" min="0.5" max="30" step="0.1" inputmode="decimal" aria-label="Distância das placas de fundo até a linha de fundo, em metros">
            <span class="sutil">altura (m)</span>
            <input id="lat-altura" type="number" min="0.2" max="5" step="0.05" inputmode="decimal" aria-label="Altura das placas laterais, em metros">
            <input id="fun-altura" type="number" min="0.2" max="5" step="0.05" inputmode="decimal" aria-label="Altura das placas de fundo, em metros">
            <span class="sutil">comprimento (m)</span>
            <input id="lat-comprimento" type="number" min="2" max="200" step="1" inputmode="decimal" placeholder="inteira" aria-label="Comprimento da faixa lateral, centrada no meio do lado, em metros (vazio: de canto a canto)">
            <input id="fun-comprimento" type="number" min="2" max="200" step="1" inputmode="decimal" placeholder="inteira" aria-label="Comprimento da faixa de fundo, centrada atrás do gol, em metros (vazio: de canto a canto)">
            <span class="sutil">vão no meio (m)</span>
            <input id="lat-vao" type="number" min="0" max="100" step="0.5" inputmode="decimal" aria-label="Vão sem placas no meio das laterais, em metros">
            <input id="fun-vao" type="number" min="0" max="100" step="0.5" inputmode="decimal" aria-label="Vão sem placas atrás do gol, em metros">
            <span class="sutil">tem placas</span>
            <input type="checkbox" id="lat-ligada" aria-label="Há placas nas laterais">
            <input type="checkbox" id="fun-ligada" aria-label="Há placas atrás dos gols">
          </div>
          <p class="sutil">Sem o levantamento do estádio, as placas são uma faixa em cada lado do campo. Ajuste até o contorno fechar com as placas da imagem; os próximos quadros da partida já abrem com estas medidas. Vão que sobrar dentro da faixa: pinte “não é placa”.</p>
        </details>

        <details class="ajuda">
          <summary>Como usar</summary>
          <ul>
            <li><b>Confira o contorno</b> de cada placa. Sem o levantamento, ajuste as faixas até ele fechar; se nem assim fecha (as linhas do campo, <kbd>M</kbd>, também não batem), é “câmera errada”.</li>
            <li><b>Pinte só o que está na frente da placa</b>: pessoa, bola, rede, grafismo ou objeto. O que fica fora dos contornos não muda. Sombra, reflexo e brilho não cobrem: deixe livre.</li>
            <li><b>Pincel</b> (<kbd>B</kbd>): arraste. <b>Laço</b> (<kbd>L</kbd>): arraste em volta, ou clique ponto a ponto e feche no primeiro ponto, com dois cliques ou <kbd>Enter</kbd>.</li>
            <li><kbd>1</kbd>–<kbd>6</kbd> escolhem o que pintar; <kbd>E</kbd> apaga. <kbd>[</kbd> <kbd>]</kbd> mudam o pincel.</li>
            <li><b>Roda do mouse</b> aproxima; botão direito (ou espaço) e arrastar move a vista. <kbd>Z</kbd> vai às placas, <kbd>0</kbd> volta a vista.</li>
            <li><kbd>H</kbd> esconde a pintura para ver a imagem; <kbd>O</kbd> os contornos; <kbd>M</kbd> mostra as linhas do campo.</li>
          </ul>
        </details>
        </div>
        <p id="erro" class="erro" role="alert"></p>
      </aside>
    </main>
  </template>

  <!-- ================================================================== revisão da oclusão -->
  <template id="tpl-revisao-oclusao">
    <header class="barra">
      <a href="#/" class="voltar">← Central</a>
      <h1>Revisão da oclusão</h1>
      <span id="dica" class="dica"></span>
      <span class="contagem-barra" id="pendentes"></span>
      <span class="tempo" title="Tempo ativo nesta revisão">⏱ <span id="tempo">0:00</span></span>
    </header>

    <main class="editor">
      <div class="tela" id="area"><canvas id="tela" aria-label="Quadro com a pintura em revisão"></canvas>

      </div>

        <section class="faixa">Você não vê quem pintou. Confira o contorno das placas e o que a pintura cobre: a roda do mouse aproxima, <kbd>Z</kbd> vai às placas e <kbd>H</kbd> esconde a pintura para ver a imagem.</section>

        <section>
          <h2>A pintura</h2>
          <dl class="ficha">
            <dt>Situação</dt><dd id="r-situacao"></dd>
            <dt>Placas</dt><dd id="r-placas"></dd>
            <dt>Partiu de</dt><dd id="r-partiu"></dd>
            <dt>Comentário</dt><dd id="r-comentario"></dd>
          </dl>
          <ul id="lista-placas" class="pinos"></ul>
          <div class="botoes"><button id="enquadrar" type="button" title="Aproxima a vista das placas que se pintam">Ir às placas <kbd>Z</kbd></button></div>
        </section>

        <section id="decidir">
          <h2>Decisão</h2>
          <div class="botoes">
            <button id="aprovar" class="primario" type="button">Aprovar <kbd>A</kbd></button>
            <button id="corrigir" type="button">Corrigir <kbd>C</kbd></button>
            <button id="devolver" type="button">Devolver <kbd>D</kbd></button>
          </div>
          <p class="sutil">Borda a até 1 px da silhueta não se corrige: aprove.</p>
        </section>

        <section id="secao-devolver" hidden>
          <h2>Devolver</h2>
          <select id="motivo" aria-label="Motivo da devolução">
            <option value="pintura_fora_da_tolerancia">Pintura fora da tolerância</option>
            <option value="classe_errada">Classe errada</option>
            <option value="faixa_fora_das_placas">Faixas fora das placas</option>
            <option value="camera_errada">Deveria ser “câmera errada”</option>
            <option value="outro">Outro (com comentário)</option>
          </select>
          <textarea id="comentario-dev" rows="2" placeholder="Comentário"></textarea>
          <div class="botoes">
            <button id="confirmar-devolver" type="button" class="primario">Confirmar devolução</button>
            <button type="button" data-voltar>Voltar</button>
          </div>
        </section>

        <section id="secao-corrigir" hidden>
          <h2>Corrigir</h2>
          <p class="sutil">Pinte como na página da oclusão. A correção vira uma versão nova, com a sua autoria.</p>
          <div class="secoes">
        <section>
          <h2 class="sutil">Pintar</h2>
          <div class="botoes alternar" role="group" aria-label="Ferramenta">
            <button type="button" data-ferramenta="pincel" aria-pressed="true">Pincel <kbd>B</kbd></button>
            <button type="button" data-ferramenta="laco" aria-pressed="false">Laço <kbd>L</kbd></button>
          </div>
          <label class="tamanho">Pincel <input id="raio" type="range" min="1" max="40" value="6" aria-label="Tamanho do pincel, em pixels da imagem"> <span id="raio-valor">6 px</span> <kbd>[</kbd> <kbd>]</kbd></label>
          <div class="classes" role="radiogroup" aria-label="O que cobre a placa">
            <label><input type="radio" name="classe" value="2" checked><span class="amostra" data-classe="2"></span> Pessoa <kbd>1</kbd></label>
            <label><input type="radio" name="classe" value="3"><span class="amostra" data-classe="3"></span> Bola <kbd>2</kbd></label>
            <label><input type="radio" name="classe" value="4"><span class="amostra" data-classe="4"></span> Rede do gol <kbd>3</kbd></label>
            <label><input type="radio" name="classe" value="5"><span class="amostra" data-classe="5"></span> Grafismo da emissora <kbd>4</kbd></label>
            <label><input type="radio" name="classe" value="6"><span class="amostra" data-classe="6"></span> Objeto (trave, câmera, banco…) <kbd>5</kbd></label>
            <label><input type="radio" name="classe" value="7"><span class="amostra" data-classe="7"></span> Não é placa (vão na faixa) <kbd>6</kbd></label>
            <label><input type="radio" name="classe" value="1"><span class="amostra" data-classe="1"></span> Apagar (placa livre) <kbd>E</kbd></label>
          </div>
          <div class="botoes">
            <button id="desfazer" type="button">Desfazer <kbd>Ctrl Z</kbd></button>
            <button id="refazer" type="button">Refazer</button>
          </div>
          <div class="camadas">
            <label><input type="checkbox" id="ver-pintura" checked> pintura <kbd>H</kbd></label>
            <label><input type="checkbox" id="ver-contornos" checked> contornos <kbd>O</kbd></label>
            <label><input type="checkbox" id="ver-molde"> linhas do campo <kbd>M</kbd></label>
          </div>
        </section>
        <details id="secao-faixas" class="secao-faixas" hidden>
          <summary><h2>Faixas de placas <span id="resumo-faixas" class="contagem"></span></h2></summary>
          <div class="faixas">
            <span></span><b>Laterais</b><b>Fundos</b>
            <span class="sutil">da linha (m)</span>
            <input id="lat-distancia" type="number" min="0.5" max="30" step="0.1" inputmode="decimal" aria-label="Distância das placas laterais até a lateral, em metros">
            <input id="fun-distancia" type="number" min="0.5" max="30" step="0.1" inputmode="decimal" aria-label="Distância das placas de fundo até a linha de fundo, em metros">
            <span class="sutil">altura (m)</span>
            <input id="lat-altura" type="number" min="0.2" max="5" step="0.05" inputmode="decimal" aria-label="Altura das placas laterais, em metros">
            <input id="fun-altura" type="number" min="0.2" max="5" step="0.05" inputmode="decimal" aria-label="Altura das placas de fundo, em metros">
            <span class="sutil">comprimento (m)</span>
            <input id="lat-comprimento" type="number" min="2" max="200" step="1" inputmode="decimal" placeholder="inteira" aria-label="Comprimento da faixa lateral, centrada no meio do lado, em metros (vazio: de canto a canto)">
            <input id="fun-comprimento" type="number" min="2" max="200" step="1" inputmode="decimal" placeholder="inteira" aria-label="Comprimento da faixa de fundo, centrada atrás do gol, em metros (vazio: de canto a canto)">
            <span class="sutil">vão no meio (m)</span>
            <input id="lat-vao" type="number" min="0" max="100" step="0.5" inputmode="decimal" aria-label="Vão sem placas no meio das laterais, em metros">
            <input id="fun-vao" type="number" min="0" max="100" step="0.5" inputmode="decimal" aria-label="Vão sem placas atrás do gol, em metros">
            <span class="sutil">tem placas</span>
            <input type="checkbox" id="lat-ligada" aria-label="Há placas nas laterais">
            <input type="checkbox" id="fun-ligada" aria-label="Há placas atrás dos gols">
          </div>
          <p class="sutil">Sem o levantamento do estádio, as placas são uma faixa em cada lado do campo. Ajuste até o contorno fechar com as placas da imagem; os próximos quadros da partida já abrem com estas medidas. Vão que sobrar dentro da faixa: pinte “não é placa”.</p>
        </details>
          </div>
          <select id="situacao-corr" aria-label="Situação da correção">
            <option value="ok">Pintado</option>
            <option value="sem_placas">Nenhuma placa para pintar</option>
            <option value="camera_errada">Câmera errada</option>
          </select>
          <textarea id="comentario-corr" rows="2" placeholder="Comentário"></textarea>
          <div class="botoes">
            <button id="salvar-correcao" class="primario" type="button">Salvar correção</button>
            <button type="button" data-voltar>Voltar</button>
          </div>
        </section>
        <p id="erro" class="erro" role="alert"></p>
      </aside>
    </main>
  </template>

  <!-- ================================================================== importar -->
  <template id="tpl-importar">
    <header class="barra">
      <a href="#/" class="voltar">← Central</a>
      <h1>Importar partida</h1>
    </header>
    <main class="central estreito">
      <section class="cartao">
        <p class="sutil">O vídeo é lido e processado neste navegador; só os quadros sorteados vão para a pasta de trabalho. Funciona com MP4 ou MOV (H.264, H.265, VP9 ou AV1). Para MKV ou TS, converta antes para MP4 (no OBS: Arquivo → Remuxar gravações).</p>
        <form id="form-importar" class="grade-form">
          <label>Estádio <input name="estadio" required autocomplete="off" placeholder="ex.: Arena da Baixada"></label>
          <label id="rotulo-pacote" hidden>Molde do campo <select name="pacote"></select></label>
          <label>Emissora <input name="emissora" required autocomplete="off"></label>
          <label>Competição <input name="competicao" required autocomplete="off"></label>
          <label>Data e hora <input name="data_hora" type="datetime-local" required></label>
          <label>Mandante <input name="mandante" required autocomplete="off"></label>
          <label>Visitante <input name="visitante" required autocomplete="off"></label>
          <label>Iluminação
            <select name="iluminacao"><option value="dia">dia</option><option value="noite">noite</option><option value="transicao">transição</option></select>
          </label>
          <label class="caixa-marcar"><input type="checkbox" name="chuva"> chuva</label>
          <label>Quadros a sortear <input name="alvo" type="number" min="1" max="5000" value="100"></label>
          <label class="largo">Trechos do vídeo (opcional)
            <input name="trechos" autocomplete="off" placeholder="ex.: 0:05:00-0:50:00, 1:05:00-1:50:00 (vazio: o vídeo inteiro)">
          </label>
          <label class="largo">Observações <input name="observacoes" autocomplete="off"></label>
          <label class="largo">Vídeo <input name="video" type="file" accept="video/mp4,video/quicktime,.mp4,.mov,.m4v" required></label>
          <div class="largo botoes">
            <button type="submit" class="primario" id="processar">Processar</button>
            <button type="button" id="cancelar" hidden>Cancelar</button>
          </div>
        </form>
        <div id="progresso" class="progresso" hidden><div class="barra-progresso"><div id="barra"></div></div><span id="etapa"></span></div>
        <p id="res-importar" class="sutil" role="status"></p>
        <p id="erro-importar" class="erro" role="alert"></p>
      </section>
    </main>
  </template>

  <!-- ================================================================== coordenação -->
  <template id="tpl-coordenacao">
    <header class="barra">
      <a href="#/" class="voltar">← Central</a>
      <h1>Coordenação</h1>
    </header>
    <main class="central">
      <p class="sutil">Tudo aqui é opcional: para anotar basta importar a partida e cada pessoa digitar o próprio código. Cada arquivo daqui tem um dono só: edite numa máquina de cada vez para o Drive não criar cópias em conflito.</p>

      <section class="cartao">
        <h2>Nomes</h2>
        <table class="tabela" id="equipe">
          <thead><tr><th>Código</th><th>Nome</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="botoes">
          <button type="button" id="mais-membro">Acrescentar</button>
          <button type="button" class="primario" id="salvar-equipe">Salvar os nomes</button>
        </div>
        <p class="sutil">Só para o placar mostrar o nome de cada código e a página central sugerir os códigos.</p>
        <p class="erro" id="erro-equipe" role="alert"></p>
      </section>

      <section class="cartao">
        <h2>Projeto</h2>
        <form id="form-projeto" class="grade-form">
          <label>Nome <input name="nome" autocomplete="off"></label>
          <label class="largo">Link do Manual de anotação <input name="manual_url" type="url" placeholder="https://…" autocomplete="off"></label>
          <div class="largo botoes"><button type="submit" class="primario">Salvar</button></div>
        </form>
        <p class="erro" id="erro-projeto" role="alert"></p>
      </section>

      <section class="cartao">
        <h2>Pacotes de estádio</h2>
        <p class="sutil">Sem pacote, o molde é o campo genérico (105 × 68 m, ajustável na página de câmera). O pacote do levantamento de um estádio traz as medidas, as placas (para conferir o lado) e a posição das câmeras.</p>
        <ul id="pacotes" class="lista"></ul>
        <label class="botao">Acrescentar pacote (pacote.json)<input type="file" id="arquivo-pacote" accept=".json,application/json" hidden></label>
        <p class="sutil">Pacote publicado não muda: medida nova é versão nova (pacote-1.1).</p>
        <p class="erro" id="erro-pacote" role="alert"></p>
      </section>

      <section class="cartao">
        <h2>Gabarito</h2>
        <p id="st-gabarito" class="sutil"></p>
        <label class="botao">Importar itens (g0001.json + imagem; na oclusão, + a máscara .png)<input type="file" id="arquivos-gabarito" accept=".json,.jpg,.jpeg,.png" multiple hidden></label>
        <p class="sutil">Os lotes de ouro em .zip entram pela página central: “Trazer arquivos de um .zip”.</p>
        <p class="erro" id="erro-gabarito" role="alert"></p>
      </section>

      <section class="cartao">
        <h2>Divisão por partida</h2>
        <p class="sutil">O que não está em validação ou teste é treino. Uma partida nunca se divide entre conjuntos.</p>
        <table class="tabela" id="divisao">
          <thead><tr><th>Partida</th><th>Conjunto</th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="botoes"><button type="button" class="primario" id="salvar-divisao">Salvar a divisão</button></div>
        <p class="erro" id="erro-divisao" role="alert"></p>
      </section>

      <section class="cartao">
        <h2>Conjunto de treino</h2>
        <p class="sutil">O conjunto (Parquet com manifesto) é gerado em Python por quem treina: <code>anotacao unificar --pasta "&lt;pasta de trabalho&gt;"</code>. Previsões do modelo para o molde abrir mais perto: <code>anotacao prever</code>.</p>
      </section>
    </main>
  </template>
</body>
</html>
