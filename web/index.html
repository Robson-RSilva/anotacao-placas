<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="description" content="Anotação de dados de treino: os pontos do campo e os jogadores, marcados direto na imagem. Tudo roda no navegador e os arquivos ficam na pasta de cada pessoa.">
  <title>Anotação de dados para treino</title>
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
  <script type="module" src="js/ui/app.js"></script>
</head>
<body class="pagina-central">
  <div id="app"><p class="carregando">Carregando…</p></div>

  <noscript><p class="erro">Esta página precisa de JavaScript.</p></noscript>

  <!-- ================================================================== boas-vindas -->
  <template id="tpl-inicio">
    <header class="barra">
      <h1>Anotação de dados para treino</h1>
      <span class="sutil" data-versao></span>
    </header>
    <main class="central estreito">
      <section class="cartao destaque">
        <h2>Onde ficam os arquivos</h2>
        <p>Tudo roda neste navegador, nesta máquina. Os quadros, rótulos e revisões ficam numa pasta de trabalho no seu computador — de preferência a pasta da equipe no Google Drive, sincronizada pelo Google Drive para computador. Esta página não envia nada para a internet.</p>
        <div id="continuar" class="bloco" hidden>
          <p>Da última vez você usou <b id="nome-anterior"></b>.</p>
          <button type="button" class="primario" id="btn-continuar">Continuar nessa pasta</button>
        </div>
        <div class="botoes">
          <button type="button" class="primario" id="btn-escolher">Escolher a pasta de trabalho</button>
          <button type="button" id="btn-navegador">Guardar neste navegador</button>
        </div>
        <p class="sutil" id="aviso-pasta" hidden>Este navegador não deixa escolher uma pasta. Use o Chrome ou o Edge no computador, ou guarde neste navegador e leve os arquivos em .zip.</p>
        <p class="erro" id="erro-inicio" role="alert"></p>
      </section>
      <details class="cartao ajuda">
        <summary>Qual escolher?</summary>
        <ul>
          <li><b>Pasta de trabalho</b> (Chrome ou Edge): escolha a pasta da equipe no Drive. Cada pessoa grava só os próprios arquivos, então a sincronização nunca entra em conflito.</li>
          <li><b>Neste navegador</b>: sem pasta sincronizada. Traga os arquivos num .zip pela página central e, ao terminar, baixe os seus num .zip para quem coordena.</li>
        </ul>
      </details>
    </main>
  </template>

  <!-- ================================================================== central -->
  <template id="tpl-central">
    <header class="barra">
      <h1>Anotação de dados para treino</h1>
      <span class="sutil" data-versao></span>
      <span class="espaco"></span>
      <form class="quem" id="form-pessoa">
        <label for="pessoa">Seu código</label>
        <input id="pessoa" list="pessoas" autocomplete="off" spellcheck="false" maxlength="10" placeholder="ex.: RS" aria-describedby="dica-pessoa">
        <datalist id="pessoas"></datalist>
        <span class="sutil" id="dica-pessoa" role="status"></span>
      </form>
    </header>

    <main class="central">
      <section id="aviso-vazia" class="cartao destaque" hidden>
        <h2>Esta pasta ainda não é uma pasta de trabalho</h2>
        <p class="sutil" id="nome-vazia"></p>
        <div class="botoes">
          <button type="button" class="primario" id="criar-vazia">Criar pasta de trabalho</button>
          <button type="button" id="trocar-vazia">Escolher outra pasta</button>
          <label class="botao">Trazer a cópia de um .zip<input type="file" id="trazer-zip-vazia" accept=".zip,application/zip" hidden></label>
        </div>
        <p class="sutil" id="res-vazia" role="status"></p>
      </section>

      <div id="conteudo-central">
        <section id="aviso-codigo" class="cartao alerta" role="alert" hidden>
          <p id="texto-aviso-codigo"></p>
          <div class="botoes"><button type="button" id="sou-eu">Sou eu, em outro computador</button></div>
        </section>
        <section class="cartoes">
          <article class="cartao">
            <h2>Pontos do campo</h2>
            <p class="sutil">Clique em cada ponto do campo que aparece na imagem.</p>
            <p id="st-pontos">—</p>
            <a class="botao primario" href="#/pontos" id="ir-pontos">Marcar pontos</a>
          </article>
          <article class="cartao">
            <h2>Jogadores</h2>
            <p class="sutil">Pinte todos os jogadores da imagem.</p>
            <p id="st-jogadores">—</p>
            <a class="botao primario" href="#/jogadores" id="ir-jogadores">Pintar jogadores</a>
          </article>
          <article class="cartao">
            <h2>Revisão às cegas</h2>
            <p class="sutil">Confira o que outras pessoas fizeram, sem saber quem fez.</p>
            <p id="st-revisao">—</p>
            <div class="botoes">
              <a class="botao" href="#/revisao-pontos" id="ir-revisao-pontos">Revisar pontos</a>
              <a class="botao" href="#/revisao-jogadores" id="ir-revisao-jogadores">Revisar jogadores</a>
            </div>
          </article>
          <article class="cartao">
            <h2>Gabarito</h2>
            <p class="sutil">O teste com as respostas certas, antes das imagens reais.</p>
            <p id="st-gabarito">—</p>
            <a class="botao" href="#/gabarito" id="ir-gabarito">Abrir o gabarito</a>
          </article>
        </section>

        <section>
          <div class="titulo-secao">
            <h2>Partidas</h2>
            <a class="botao" href="#/importar" id="ir-importar">Importar partida</a>
          </div>
          <div class="rolavel">
            <table class="tabela" id="partidas">
              <thead><tr><th>Partida</th><th>Emissora</th><th>Condições</th><th>Sorteados</th><th title="Quadros com os pontos aprovados na revisão e a parte dos sorteados; desc.: quantos deles foram descartados">Pontos aprovados</th><th title="Quadros com a pintura aprovada na revisão e a parte dos sorteados; desc.: quantos deles foram descartados">Jogadores aprovados</th><th>Revisão pendente</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section>
          <div class="titulo-secao">
            <h2>Placar</h2>
            <div class="botoes alternar" role="group" aria-label="Tarefa do placar">
              <button type="button" data-placar="pontos" aria-pressed="true">Pontos</button>
              <button type="button" data-placar="jogadores" aria-pressed="false">Jogadores</button>
            </div>
          </div>
          <p class="sutil">Ponto só conta depois de aprovado na revisão às cegas.</p>
          <div class="rolavel">
            <table class="tabela" id="placar">
              <thead><tr><th>Pessoa</th><th>Aprovados na semana</th><th>Aprovados</th><th>Taxa de aprovação</th><th>Tempo mediano</th><th id="th-concordancia">Concordância (cegos)</th><th>Gabarito</th><th>Dias seguidos</th><th>Marcos</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section class="cartao">
          <h2>Pasta de trabalho</h2>
          <p><span id="pasta-nome"></span> <span class="sutil" id="pasta-modo"></span></p>
          <div class="botoes">
            <button type="button" id="trocar-pasta">Trocar de pasta</button>
            <button type="button" id="baixar-meus">Baixar os meus arquivos (.zip)</button>
            <button type="button" id="baixar-tudo">Baixar cópia da pasta (.zip)</button>
            <label class="botao">Trazer arquivos de um .zip<input type="file" id="trazer-zip" accept=".zip,application/zip" hidden></label>
            <a class="botao" href="#/coordenacao">Coordenação (opcional)</a>
          </div>
          <p class="sutil" id="res-pasta" role="status"></p>
        </section>
      </div>
    </main>

    <footer class="rodape">
      <span>Os dados ficam no seu computador; esta página não envia nada para a internet.</span>
      <a id="manual" href="#" target="_blank" rel="noopener noreferrer" hidden>Manual de anotação</a>
    </footer>
  </template>

  <!-- ================================================================== caixas compartilhadas -->
  <template id="tpl-caixas">
    <div id="caixa-descartar" class="modal" hidden>
      <form class="caixa" role="dialog" aria-modal="true" aria-labelledby="titulo-descartar" id="form-descartar">
        <h2 id="titulo-descartar">Descartar esta imagem?</h2>
        <p class="sutil">Descarte só a imagem que não dá para anotar direito. Uma imagem normal em que não aparece nada para marcar você salva vazia — ela também serve para o treino.</p>
        <div class="situacoes" id="motivos-descarte"></div>
        <textarea id="comentario-descarte" rows="2" placeholder="Comentário (obrigatório em “outro motivo”)"></textarea>
        <p class="erro" id="erro-descartar" role="alert"></p>
        <div class="botoes">
          <button type="submit" class="primario" id="confirmar-descartar">Descartar</button>
          <button type="button" id="voltar-descartar">Voltar</button>
        </div>
      </form>
    </div>
    <div id="caixa-confirmar" class="modal" hidden>
      <div class="caixa" role="dialog" aria-modal="true" aria-labelledby="titulo-confirmar">
        <h2 id="titulo-confirmar"></h2>
        <p id="texto-confirmar"></p>
        <div class="botoes">
          <button type="button" class="primario" id="sim-confirmar">Salvar assim</button>
          <button type="button" id="nao-confirmar">Voltar</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ================================================================== pontos -->
  <template id="tpl-pontos">
    <header class="barra">
      <a href="#/" class="voltar">← Central</a>
      <h1>Pontos do campo</h1>
      <span id="dica" class="dica"></span>
      <span class="tempo" title="Tempo ativo nesta imagem">⏱ <span id="tempo">0:00</span></span>
    </header>

    <main class="editor">
      <div class="tela" id="area"><canvas id="tela" aria-label="A imagem, com os pontos marcados"></canvas>
        <div id="vazio" class="vazio" hidden></div>
      </div>

      <aside class="painel largo" id="painel" hidden>
        <section id="treino" class="faixa treino" hidden>Teste do gabarito: esta imagem tem resposta. Ao salvar, você vê o resultado.</section>
        <section id="devolvido" class="faixa devolvido" hidden></section>
        <section id="partiu" class="faixa" hidden></section>

        <section id="resultado" class="faixa resultado" hidden>
          <h2 id="resultado-titulo"></h2>
          <p id="resultado-texto"></p>
          <p class="legenda"><span class="cor certo"></span> no lugar <span class="cor longe"></span> perto <span class="cor errado"></span> errado <span class="cor faltou"></span> faltou <span class="cor verdade"></span> resposta</p>
          <div class="botoes">
            <button id="ver-resposta" type="button">Ver a resposta <kbd>V</kbd></button>
            <button id="proximo" class="primario" type="button">Próximo <kbd>N</kbd></button>
            <a id="voltar-gabarito" class="botao" href="#/gabarito" hidden>Voltar ao gabarito</a>
          </div>
        </section>

        <section>
          <div class="titulo-secao">
            <h2>Mapa do campo</h2>
            <button id="girar" type="button" title="Gira o mapa 90 graus: deixe embaixo o lado mais perto da câmera">Girar <kbd>R</kbd></button>
          </div>
          <div id="mapa" class="caixa-mapa"></div>
          <p id="escolha" class="escolha" role="status"></p>
        </section>

        <div id="edicao" class="secoes">
          <section>
            <h2>Marcados <span id="n-pontos" class="contagem"></span></h2>
            <ul id="lista-pontos" class="pinos"></ul>
            <div class="botoes">
              <button id="desfazer" type="button">Desfazer <kbd>Ctrl Z</kbd></button>
              <label class="caixa-marcar"><input type="checkbox" id="ver-nomes"> nomes <kbd>L</kbd></label>
            </div>
          </section>

          <div class="botoes acoes">
            <button id="salvar" class="primario" type="button">Salvar <kbd>S</kbd></button>
            <button id="descartar" type="button">Descartar imagem <kbd>D</kbd></button>
          </div>
          <p id="erro" class="erro" role="alert"></p>

          <details class="ajuda" open>
            <summary>Como marcar</summary>
            <ul>
              <li><b>Escolha o ponto no mapa e clique no lugar dele na imagem.</b> Ou o contrário: clique na imagem e depois no mapa.</li>
              <li>Marque <b>todo ponto do campo que aparece</b>, no centro exato do cruzamento das linhas (ou da marca, ou da trave). Aproxime com a roda do mouse; a lupa mostra o pixel.</li>
              <li><b>Gire o mapa</b> (<kbd>R</kbd>) até ele ficar como a imagem: o lado de baixo do mapa é o mais perto da câmera. Câmera atrás do gol: o gol de perto embaixo.</li>
              <li>Ponto coberto por um jogador: marque só se dá para saber exatamente onde ele está. Fora da imagem, não marque.</li>
              <li>Nenhum ponto à vista (um close, a torcida)? Salve sem pontos. <b>Descarte</b> só a imagem que não dá para anotar (transição, borrão, grafismo por cima).</li>
              <li><b>Arraste</b> um ponto para ajustar; <b>botão direito</b> (ou <kbd>Delete</kbd>) apaga. <kbd>Esc</kbd> cancela o ponto escolhido. Botão direito e arrastar move a vista; <kbd>0</kbd> volta a vista; <kbd>H</kbd> esconde os pontos.</li>
            </ul>
          </details>
        </div>
      </aside>
    </main>
  </template>

  <!-- ================================================================== jogadores -->
  <template id="tpl-jogadores">
    <header class="barra">
      <a href="#/" class="voltar">← Central</a>
      <h1>Jogadores</h1>
      <span id="dica" class="dica"></span>
      <span class="tempo" title="Tempo ativo nesta imagem">⏱ <span id="tempo">0:00</span></span>
    </header>

    <main class="editor">
      <div class="tela" id="area"><canvas id="tela" aria-label="A imagem, com a pintura dos jogadores"></canvas>
        <div id="vazio" class="vazio" hidden></div>
      </div>

      <aside class="painel" id="painel" hidden>
        <section id="treino" class="faixa treino" hidden>Teste do gabarito: esta imagem tem resposta. Ao salvar, você vê o resultado.</section>
        <section id="devolvido" class="faixa devolvido" hidden></section>
        <section id="partiu" class="faixa" hidden></section>

        <section id="resultado" class="faixa resultado" hidden>
          <h2 id="resultado-titulo"></h2>
          <p id="resultado-texto"></p>
          <p class="legenda"><span class="cor certo"></span> certo <span class="cor errado"></span> faltou <span class="cor longe"></span> a mais <span class="cor faltou"></span> não é jogador</p>
          <div class="botoes">
            <button id="ver-resposta" type="button">Ver a resposta <kbd>V</kbd></button>
            <button id="proximo" class="primario" type="button">Próximo <kbd>N</kbd></button>
            <a id="voltar-gabarito" class="botao" href="#/gabarito" hidden>Voltar ao gabarito</a>
          </div>
        </section>

        <div id="edicao" class="secoes">
          <section>
            <h2>O que pintar</h2>
            <p class="sutil">Todos os jogadores, inclusive os goleiros: o corpo inteiro, do cabelo à chuteira. <b>Não pinte</b> árbitros, gandulas, fotógrafos, comissão técnica, torcida nem a sombra no gramado.</p>
          </section>
          <section>
            <h2>Pintar</h2>
            <div class="botoes alternar" role="group" aria-label="Ferramenta">
              <button type="button" data-ferramenta="pincel" aria-pressed="true">Pincel <kbd>B</kbd></button>
              <button type="button" data-ferramenta="laco" aria-pressed="false">Laço <kbd>L</kbd></button>
              <button type="button" id="borracha" aria-pressed="false">Borracha <kbd>E</kbd></button>
            </div>
            <label class="tamanho">Pincel <input id="raio" type="range" min="1" max="30" value="4" aria-label="Tamanho do pincel, em pixels da imagem"> <span id="raio-valor">4 px</span> <kbd>[</kbd> <kbd>]</kbd></label>
            <div class="botoes">
              <button id="desfazer" type="button">Desfazer <kbd>Ctrl Z</kbd></button>
              <button id="refazer" type="button">Refazer</button>
              <label class="caixa-marcar"><input type="checkbox" id="ver-pintura" checked> pintura <kbd>H</kbd></label>
            </div>
          </section>

          <div class="botoes acoes">
            <button id="salvar" class="primario" type="button">Salvar <kbd>S</kbd></button>
            <button id="descartar" type="button">Descartar imagem <kbd>D</kbd></button>
          </div>
          <p id="erro" class="erro" role="alert"></p>

          <details class="ajuda" open>
            <summary>Como pintar</summary>
            <ul>
              <li><b>Laço</b> (<kbd>L</kbd>) é o mais rápido: arraste em volta do jogador e solte; ou clique ponto a ponto e feche no primeiro ponto, com dois cliques ou <kbd>Enter</kbd>.</li>
              <li><b>Pincel</b> (<kbd>B</kbd>) para os detalhes: braços, pernas, a chuteira. <kbd>[</kbd> e <kbd>]</kbd> mudam o tamanho.</li>
              <li><b>Borracha</b> (<kbd>E</kbd>): o pincel e o laço passam a apagar.</li>
              <li>Pinte até a borda do jogador: <b>1 px de folga</b> não conta. Jogador atrás de outro: pinte o que aparece.</li>
              <li>Nenhum jogador na imagem? Salve sem pintar. <b>Descarte</b> só a imagem que não dá para anotar (transição, borrão, grafismo por cima).</li>
              <li><b>Roda do mouse</b> aproxima; botão direito (ou espaço) e arrastar move a vista; <kbd>0</kbd> volta a vista; <kbd>H</kbd> esconde a pintura para comparar com a imagem.</li>
            </ul>
          </details>
        </div>
      </aside>
    </main>
  </template>

  <!-- ================================================================== revisão dos pontos -->
  <template id="tpl-revisao-pontos">
    <header class="barra">
      <a href="#/" class="voltar">← Central</a>
      <h1>Revisão às cegas · Pontos</h1>
      <span id="dica" class="dica"></span>
      <span class="contagem-barra" id="pendentes"></span>
      <span class="tempo" title="Tempo ativo nesta revisão">⏱ <span id="tempo">0:00</span></span>
    </header>

    <main class="editor">
      <div class="tela" id="area"><canvas id="tela" aria-label="A imagem, com os pontos em revisão"></canvas>
        <div id="vazio" class="vazio" hidden></div>
      </div>

      <aside class="painel largo" id="painel" hidden>
        <details class="faixa como-revisar" open>
          <summary><b>Como revisar</b> — você não sabe quem marcou, e quem marcou não sabe quem revisa.</summary>
          <ol>
            <li>Passe o mouse em cada ponto: o nome aparece na imagem e no mapa. <b>Está no centro do cruzamento</b> (até 2 px)? <b>O nome confere</b> com o lugar no mapa?</li>
            <li>Procure <b>ponto que aparece e ficou sem marcar</b>, e ponto marcado onde não dá para ver.</li>
            <li>Decida. <b>Aprovar</b> (<kbd>A</kbd>): está certo. <b>Corrigir</b> (<kbd>C</kbd>): dá para consertar rápido — você ajusta, e a correção vale com o seu nome. <b>Devolver</b> (<kbd>D</kbd>): precisa refazer — volta para quem marcou, com o motivo.</li>
            <li>Imagem descartada: aprove se ela não dá mesmo para anotar; se dá, devolva (“descarte errado”) ou corrija marcando os pontos.</li>
          </ol>
        </details>

        <section>
          <h2>O rótulo</h2>
          <dl class="ficha">
            <dt>Situação</dt><dd id="r-situacao"></dd>
            <dt>Pontos</dt><dd id="r-pontos"></dd>
            <dt>Partiu de</dt><dd id="r-partiu"></dd>
            <dt>Comentário</dt><dd id="r-comentario"></dd>
          </dl>
        </section>

        <section>
          <div class="titulo-secao">
            <h2>Mapa do campo</h2>
            <button id="girar" type="button" title="Gira o mapa 90 graus">Girar <kbd>R</kbd></button>
          </div>
          <div id="mapa" class="caixa-mapa"></div>
          <p id="escolha" class="escolha" role="status"></p>
        </section>

        <section id="decidir">
          <h2>Decisão</h2>
          <div class="botoes">
            <button id="aprovar" class="primario" type="button">Aprovar <kbd>A</kbd></button>
            <button id="corrigir" type="button">Corrigir <kbd>C</kbd></button>
            <button id="devolver" type="button">Devolver <kbd>D</kbd></button>
          </div>
          <p class="sutil">Diferença de até 2 px não se corrige: aprove.</p>
        </section>

        <section id="secao-devolver" hidden>
          <h2>Devolver</h2>
          <select id="motivo" aria-label="Motivo da devolução"></select>
          <textarea id="comentario-dev" rows="2" placeholder="Comentário para quem marcou (o que corrigir)"></textarea>
          <div class="botoes">
            <button id="confirmar-devolver" type="button" class="primario">Confirmar devolução</button>
            <button type="button" data-voltar>Voltar</button>
          </div>
        </section>

        <section id="secao-corrigir" hidden>
          <h2>Corrigir</h2>
          <p class="sutil">Como na página de pontos: escolha no mapa e clique na imagem; arraste para ajustar; botão direito apaga. A correção vira uma versão nova, com a sua autoria.</p>
          <ul id="lista-pontos" class="pinos"></ul>
          <div class="botoes">
            <button id="desfazer" type="button">Desfazer <kbd>Ctrl Z</kbd></button>
            <button id="descartar" type="button">Descartar em vez disso</button>
          </div>
          <textarea id="comentario-corr" rows="2" placeholder="Comentário (opcional)"></textarea>
          <div class="botoes">
            <button id="salvar-correcao" class="primario" type="button">Salvar correção</button>
            <button type="button" data-voltar>Voltar</button>
          </div>
        </section>
        <p id="erro" class="erro" role="alert"></p>
      </aside>
    </main>
  </template>

  <!-- ================================================================== revisão dos jogadores -->
  <template id="tpl-revisao-jogadores">
    <header class="barra">
      <a href="#/" class="voltar">← Central</a>
      <h1>Revisão às cegas · Jogadores</h1>
      <span id="dica" class="dica"></span>
      <span class="contagem-barra" id="pendentes"></span>
      <span class="tempo" title="Tempo ativo nesta revisão">⏱ <span id="tempo">0:00</span></span>
    </header>

    <main class="editor">
      <div class="tela" id="area"><canvas id="tela" aria-label="A imagem, com a pintura em revisão"></canvas>
        <div id="vazio" class="vazio" hidden></div>
      </div>

      <aside class="painel" id="painel" hidden>
        <details class="faixa como-revisar" open>
          <summary><b>Como revisar</b> — você não sabe quem pintou, e quem pintou não sabe quem revisa.</summary>
          <ol>
            <li>Aproxime com a roda do mouse e esconda e mostre a pintura (<kbd>H</kbd>) para comparar com a imagem.</li>
            <li>Confira: <b>todo jogador pintado</b> (goleiros também), <b>inteiro</b> e até a borda (1 px de folga não conta)? <b>Ninguém que não é jogador</b> pintado (árbitro, gandula, torcida), nem a sombra?</li>
            <li>Decida. <b>Aprovar</b> (<kbd>A</kbd>): está certo. <b>Corrigir</b> (<kbd>C</kbd>): dá para consertar rápido — você pinta, e a correção vale com o seu nome. <b>Devolver</b> (<kbd>D</kbd>): precisa refazer — volta para quem pintou, com o motivo.</li>
            <li>Imagem descartada: aprove se ela não dá mesmo para anotar; se dá, devolva (“descarte errado”) ou corrija pintando.</li>
          </ol>
        </details>

        <section>
          <h2>A pintura</h2>
          <dl class="ficha">
            <dt>Situação</dt><dd id="r-situacao"></dd>
            <dt>Pintado</dt><dd id="r-pixels"></dd>
            <dt>Partiu de</dt><dd id="r-partiu"></dd>
            <dt>Comentário</dt><dd id="r-comentario"></dd>
          </dl>
          <div class="botoes"><label class="caixa-marcar"><input type="checkbox" id="ver-pintura" checked> pintura <kbd>H</kbd></label></div>
        </section>

        <section id="decidir">
          <h2>Decisão</h2>
          <div class="botoes">
            <button id="aprovar" class="primario" type="button">Aprovar <kbd>A</kbd></button>
            <button id="corrigir" type="button">Corrigir <kbd>C</kbd></button>
            <button id="devolver" type="button">Devolver <kbd>D</kbd></button>
          </div>
          <p class="sutil">Borda a até 1 px da silhueta não se corrige: aprove.</p>
        </section>

        <section id="secao-devolver" hidden>
          <h2>Devolver</h2>
          <select id="motivo" aria-label="Motivo da devolução"></select>
          <textarea id="comentario-dev" rows="2" placeholder="Comentário para quem pintou (o que corrigir)"></textarea>
          <div class="botoes">
            <button id="confirmar-devolver" type="button" class="primario">Confirmar devolução</button>
            <button type="button" data-voltar>Voltar</button>
          </div>
        </section>

        <section id="secao-corrigir" hidden>
          <h2>Corrigir</h2>
          <p class="sutil">Como na página dos jogadores. A correção vira uma versão nova, com a sua autoria.</p>
          <div class="botoes alternar" role="group" aria-label="Ferramenta">
            <button type="button" data-ferramenta="pincel" aria-pressed="true">Pincel <kbd>B</kbd></button>
            <button type="button" data-ferramenta="laco" aria-pressed="false">Laço <kbd>L</kbd></button>
            <button type="button" id="borracha" aria-pressed="false">Borracha <kbd>E</kbd></button>
          </div>
          <label class="tamanho">Pincel <input id="raio" type="range" min="1" max="30" value="4" aria-label="Tamanho do pincel, em pixels da imagem"> <span id="raio-valor">4 px</span> <kbd>[</kbd> <kbd>]</kbd></label>
          <div class="botoes">
            <button id="desfazer" type="button">Desfazer <kbd>Ctrl Z</kbd></button>
            <button id="refazer" type="button">Refazer</button>
            <button id="descartar" type="button">Descartar em vez disso</button>
          </div>
          <textarea id="comentario-corr" rows="2" placeholder="Comentário (opcional)"></textarea>
          <div class="botoes">
            <button id="salvar-correcao" class="primario" type="button">Salvar correção</button>
            <button type="button" data-voltar>Voltar</button>
          </div>
        </section>
        <p id="erro" class="erro" role="alert"></p>
      </aside>
    </main>
  </template>

  <!-- ================================================================== gabarito -->
  <template id="tpl-gabarito">
    <header class="barra">
      <a href="#/" class="voltar">← Central</a>
      <h1>Gabarito</h1>
      <span class="espaco"></span>
      <span class="sutil" id="quem-gabarito"></span>
    </header>
    <main class="central">
      <section class="cartao destaque">
        <h2>Como funciona o teste</h2>
        <ol class="passos">
          <li><b>Faça o teste de cada tarefa.</b> São imagens com a resposta certa: você anota como sempre e, ao salvar, vê o resultado e pode ver a resposta.</li>
          <li><b>Você é liberado para as imagens reais</b> quando acerta <span id="meta-pontos">8 das últimas 10</span> nos pontos, e <span id="meta-jogadores">4 das últimas 5</span> nos jogadores. Até lá, a página da tarefa só mostra o teste.</li>
          <li><b>Depois, de vez em quando</b> (uma a cada 15 imagens), uma imagem do gabarito aparece no meio das reais, sem aviso e sem resultado: é assim que a qualidade é medida o tempo todo. Quem cai muito volta para o teste.</li>
        </ol>
      </section>

      <section class="cartoes" id="cartoes-gabarito">
        <article class="cartao" data-tarefa="pontos">
          <h2>Pontos do campo</h2>
          <p class="st"></p>
          <div class="barra-progresso" aria-hidden="true"><div></div></div>
          <p class="sutil regra"></p>
          <div class="botoes"><a class="botao primario fazer" href="#/pontos?treino">Fazer o teste</a></div>
        </article>
        <article class="cartao" data-tarefa="jogadores">
          <h2>Jogadores</h2>
          <p class="st"></p>
          <div class="barra-progresso" aria-hidden="true"><div></div></div>
          <p class="sutil regra"></p>
          <div class="botoes"><a class="botao primario fazer" href="#/jogadores?treino">Fazer o teste</a></div>
        </article>
      </section>

      <section>
        <div class="titulo-secao">
          <h2>Seus resultados</h2>
          <div class="botoes alternar" role="group" aria-label="Tarefa">
            <button type="button" data-res="pontos" aria-pressed="true">Pontos</button>
            <button type="button" data-res="jogadores" aria-pressed="false">Jogadores</button>
          </div>
        </div>
        <div class="rolavel">
          <table class="tabela" id="resultados">
            <thead><tr><th>Item</th><th>Lote</th><th>Quando</th><th>Como</th><th>Resultado</th><th></th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="cartao">
        <h2>Lotes de ouro nesta pasta</h2>
        <div class="rolavel">
          <table class="tabela" id="lotes">
            <thead><tr><th>Lote</th><th>Tarefa</th><th>Itens</th><th>Números</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="botoes">
          <label class="botao">Importar lote de ouro (.zip)<input type="file" id="importar-lote" accept=".zip,application/zip" hidden></label>
        </div>
        <p class="sutil">Quem coordena importa uma vez, na pasta da equipe: todo mundo vê. Os lotes não se sobrepõem: dá para importar um, alguns ou todos.</p>
        <p class="sutil" id="res-lote" role="status"></p>
      </section>
    </main>
  </template>

  <!-- ================================================================== importar -->
  <template id="tpl-importar">
    <header class="barra">
      <a href="#/" class="voltar">← Central</a>
      <h1>Importar partida</h1>
    </header>
    <main class="central estreito">
      <section class="cartao">
        <p class="sutil">O vídeo é lido e processado neste navegador; só os quadros sorteados vão para a pasta de trabalho. Funciona com MP4 ou MOV (H.264, H.265, VP9 ou AV1). Para MKV ou TS, converta antes para MP4 (no OBS: Arquivo → Remuxar gravações).</p>
        <form id="form-importar" class="grade-form">
          <label>Estádio <input name="estadio" required autocomplete="off" placeholder="ex.: Arena da Baixada"></label>
          <label>Emissora <input name="emissora" required autocomplete="off"></label>
          <label>Competição <input name="competicao" required autocomplete="off"></label>
          <label>Data e hora <input name="data_hora" type="datetime-local" required></label>
          <label>Mandante <input name="mandante" required autocomplete="off"></label>
          <label>Visitante <input name="visitante" required autocomplete="off"></label>
          <label>Iluminação
            <select name="iluminacao"><option value="dia">dia</option><option value="noite">noite</option><option value="transicao">transição</option></select>
          </label>
          <label class="caixa-marcar"><input type="checkbox" name="chuva"> chuva</label>
          <label>Quadros a sortear <input name="alvo" type="text" inputmode="numeric" autocomplete="off" value="100" aria-describedby="dica-alvo"><span class="sutil" id="dica-alvo">de 1 a 5000</span></label>
          <label class="largo">Trechos do vídeo (opcional)
            <input name="trechos" autocomplete="off" placeholder="ex.: 0:05:00-0:50:00, 1:05:00-1:50:00 (vazio: o vídeo inteiro)">
          </label>
          <label class="largo">Observações <input name="observacoes" autocomplete="off"></label>
          <label class="largo">Vídeo <input name="video" type="file" accept="video/mp4,video/quicktime,.mp4,.mov,.m4v" required></label>
          <div class="largo botoes">
            <button type="submit" class="primario" id="processar">Processar</button>
            <button type="button" id="cancelar" hidden>Cancelar</button>
          </div>
        </form>
        <div id="progresso" class="progresso" hidden><div class="barra-progresso"><div id="barra"></div></div><span id="etapa"></span></div>
        <p id="res-importar" class="sutil" role="status"></p>
        <p id="erro-importar" class="erro" role="alert"></p>
      </section>
    </main>
  </template>

  <!-- ================================================================== coordenação -->
  <template id="tpl-coordenacao">
    <header class="barra">
      <a href="#/" class="voltar">← Central</a>
      <h1>Coordenação</h1>
    </header>
    <main class="central">
      <p class="sutil">Tudo aqui é opcional: para anotar basta importar a partida e cada pessoa digitar o próprio código. Cada arquivo daqui tem um dono só: edite numa máquina de cada vez para o Drive não criar cópias em conflito.</p>

      <section class="cartao">
        <h2>Nomes</h2>
        <table class="tabela" id="equipe">
          <thead><tr><th>Código</th><th>Nome</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="botoes">
          <button type="button" id="mais-membro">Acrescentar</button>
          <button type="button" class="primario" id="salvar-equipe">Salvar os nomes</button>
        </div>
        <p class="sutil">Só para o placar mostrar o nome de cada código e a página central sugerir os códigos.</p>
        <p class="erro" id="erro-equipe" role="alert"></p>
      </section>

      <section class="cartao">
        <h2>Projeto</h2>
        <form id="form-projeto" class="grade-form">
          <label>Nome <input name="nome" autocomplete="off"></label>
          <label class="largo">Link do Manual de anotação <input name="manual_url" type="url" placeholder="https://…" autocomplete="off"></label>
          <div class="largo botoes"><button type="submit" class="primario">Salvar</button></div>
        </form>
        <p class="erro" id="erro-projeto" role="alert"></p>
      </section>

      <section class="cartao">
        <h2>Gabarito</h2>
        <p id="st-gabarito" class="sutil"></p>
        <div class="botoes"><a class="botao" href="#/gabarito">Abrir a página do gabarito</a></div>
        <p class="sutil">Os lotes de ouro em .zip entram pela página do gabarito. Para itens soltos (gNNNN.json com a imagem e, nos jogadores, a máscara .png):</p>
        <label class="botao">Importar itens soltos<input type="file" id="arquivos-gabarito" accept=".json,.jpg,.jpeg,.png" multiple hidden></label>
        <p class="erro" id="erro-gabarito" role="alert"></p>
      </section>

      <section class="cartao">
        <h2>Divisão por partida</h2>
        <p class="sutil">O que não está em validação ou teste é treino. Uma partida nunca se divide entre conjuntos.</p>
        <table class="tabela" id="divisao">
          <thead><tr><th>Partida</th><th>Conjunto</th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="botoes"><button type="button" class="primario" id="salvar-divisao">Salvar a divisão</button></div>
        <p class="erro" id="erro-divisao" role="alert"></p>
      </section>

      <section class="cartao">
        <h2>Conjunto de treino</h2>
        <p class="sutil">O conjunto (Parquet com manifesto) é gerado em Python por quem treina: <code>anotacao unificar --pasta "&lt;pasta de trabalho&gt;"</code>. Para a imagem já abrir com os pontos (ou a pintura) de um modelo: <code>anotacao prever --tarefa pontos</code> (ou <code>jogadores</code>).</p>
      </section>
    </main>
  </template>
</body>
</html>
