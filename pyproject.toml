[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anotacao-placas"
version = "0.1.0"
description = "Páginas locais de anotação que geram os dados de treino do detector de marcações (exposição de placas)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietário — uso interno" }
authors = [{ name = "Robson" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pandas>=2.1",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
e2e = ["playwright>=1.40"]

[project.scripts]
anotacao = "anotacao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anotacao = ["web/*.html", "web/css/*.css", "web/js/*.js", "esquemas/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # textos em português têm "–", "×" e aspas tipográficas de propósito
  "N802", "N803", "N806",        # nomes de variáveis matemáticas (R, C, K, L, W) seguem a notação do laboratório
  "B008",
  "N818",                        # exceções com nome em português (ArquivoExiste, PartidaJaExiste)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["e2e: teste de ponta a ponta no navegador (precisa do Playwright e do Chromium)"]
