[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anotacao-placas"
version = "0.12.0"
description = "Ferramentas da pasta de trabalho da anotação de dados de treino (pontos do campo e o que cobre as placas): formatos, recortes, validar, unificar, gabarito e previsões."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Todos os direitos reservados" }
authors = [{ name = "Robson" }]
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pandas>=2.1",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
e2e = ["playwright>=1.40"]

[project.scripts]
anotacao = "anotacao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # textos em português têm "–", "×" e aspas tipográficas de propósito
  "N802", "N803", "N806",        # nomes de variáveis matemáticas (R, C, K, L, W) seguem a notação do laboratório
  "B008",
  "N818",                        # exceções com nome em português (ArquivoExiste)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest", "sintetico", "previsor_teste"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: teste de ponta a ponta no navegador (precisa do Playwright, do Chromium e do ffmpeg)"]
